[package]
name = "disk_cleaner"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
tokio = { version = "1.54.1", features = ["full", "rt-multi-thread"] }
jsonschema = "0.61.2"
